<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gym Diary</title>
  <desc id="desc">Plataforma full stack para planejar, executar e acompanhar treinos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320"><stop stop-color="#07130F"/><stop offset=".5" stop-color="#101814"/><stop offset="1" stop-color="#17120D"/></linearGradient>
    <linearGradient id="accent" x1="130" y1="50" x2="1050" y2="280"><stop stop-color="#BEF264"/><stop offset=".55" stop-color="#84CC16"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#D9F99D" stroke-opacity=".05"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.dash{stroke-dasharray:8 10;animation:dash 10s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.dash,.pulse{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#bg)" stroke="#84CC16" stroke-opacity=".6" stroke-width="2"/><rect x="2" y="2" width="1196" height="316" rx="21" fill="url(#grid)"/><circle cx="1090" cy="-15" r="250" fill="#84CC16" fill-opacity=".055"/>
  <g transform="translate(52 44)"><circle cx="7" cy="7" r="5" fill="#A3E635" filter="url(#glow)" class="pulse"/><text x="24" y="12" class="mono" font-size="12" font-weight="700" letter-spacing="2.4" fill="#A3E635">WORKOUT MANAGEMENT SYSTEM</text><text x="0" y="91" class="sans" font-size="64" font-weight="850" letter-spacing="-2" fill="#F7FEE7">Gym <tspan fill="url(#accent)">Diary</tspan></text><text x="2" y="132" class="mono" font-size="17" font-weight="600" fill="#D9F99D">PLANEJE  ·  TREINE  ·  ACOMPANHE  ·  EVOLUA</text><text x="2" y="174" class="sans" font-size="17" fill="#A8B3A3">Uma plataforma full stack para transformar rotina em progresso.</text><g transform="translate(2 202)" class="mono" font-size="10" font-weight="700" letter-spacing="1.3"><g><rect width="108" height="31" rx="15.5" fill="#84CC16" fill-opacity=".09" stroke="#84CC16" stroke-opacity=".5"/><text x="18" y="20" fill="#D9F99D">REACT 18</text></g><g transform="translate(120)"><rect width="118" height="31" rx="15.5" fill="#84CC16" fill-opacity=".09" stroke="#84CC16" stroke-opacity=".5"/><text x="18" y="20" fill="#D9F99D">NODE.JS</text></g><g transform="translate(250)"><rect width="105" height="31" rx="15.5" fill="#F59E0B" fill-opacity=".08" stroke="#F59E0B" stroke-opacity=".5"/><text x="18" y="20" fill="#FDE68A">MYSQL</text></g></g></g>
  <g transform="translate(1003 158)"><circle r="104" stroke="#84CC16" stroke-opacity=".18"/><circle r="78" stroke="#A3E635" stroke-opacity=".68" class="dash"/><circle r="50" stroke="#F59E0B" stroke-opacity=".28"/><path d="M-103 0H103M0-103V103" stroke="#D9F99D" stroke-opacity=".14"/><g fill="#0B1710" stroke="#A3E635" stroke-width="2"><circle cy="-78" r="7"/><circle cx="68" cy="-39" r="7"/><circle cx="68" cy="39" r="7"/><circle cy="78" r="7"/><circle cx="-68" cy="39" r="7"/><circle cx="-68" cy="-39" r="7"/></g><circle r="30" fill="#142016" stroke="url(#accent)" stroke-width="2"/><path d="M-16-5h8v10h-8M16-5H8v10h8M-8 0H8" stroke="#BEF264" stroke-width="4" stroke-linecap="round"/><circle r="39" stroke="#A3E635" stroke-width="2" opacity=".2" class="pulse"/></g>
</svg>
